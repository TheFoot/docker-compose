general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  allow_non_registered_models: true

server_settings:
  host: 0.0.0.0
  port: 4000

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  timeout: 120
  enable_auto_tool_choice: true
  tool_call_parser: true

llm_credentials:
  openai:
    api_base: https://api.openai.com/v1
    api_key: os.environ/OPENAI_API_KEY
  anthropic:
    api_base: https://api.anthropic.com
    api_key: os.environ/ANTHROPIC_API_KEY
  spark:
    provider: openai
    api_base: os.environ/SPARK_BASE_URL

model_list:

  # OpenAI - all models dynamically accessible
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic - model aliases for "-latest" convenience names (Claude 4.6)
  - model_name: "anthropic/claude-sonnet-latest"
    litellm_params:
      model: "anthropic/claude-sonnet-4-6"
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: "anthropic/claude-opus-latest"
    litellm_params:
      model: "anthropic/claude-opus-4-6"
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: "anthropic/claude-haiku-latest"
    litellm_params:
      model: "anthropic/claude-haiku-4-5-20251001"
      api_key: os.environ/ANTHROPIC_API_KEY

  # Anthropic - all models dynamically accessible (for exact model IDs)
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

  # Spark - NVIDIA DGX Spark inference (default: Qwen3.8-27B-NVFP4 dense, 2026-08-17)
  - model_name: spark/qwen38-27b-nvfp4
    litellm_params:
      model: openai/qwen38-27b-nvfp4
      api_base: os.environ/SPARK_BASE_URL
      enable_auto_tool_choice: true
      tool_call_parser: true
      supports_function_calling: true


  # Spark - Qwen3.8-Flash-Next-NVFP4 (RadixArk/Qwen3.8-Flash-Next-NVFP4 snapshot 7b71922524)
  - model_name: spark/qwen38-flash-next-nvfp4
    litellm_params:
      model: openai/qwen38-flash-next
      api_base: os.environ/SPARK_BASE_URL
      enable_auto_tool_choice: true
      tool_call_parser: true
      supports_function_calling: true

  # Stable alias for the estate's current default local model. Callers should
  # target `local/default` and NOT the underlying engine tag. To rotate the
  # local model, repoint ONLY this entry's litellm_params.model to the new
  # concrete engine tag (e.g. openai/<new-model>); no caller changes needed.
  - model_name: local/default
    litellm_params:
      model: openai/qwen38-27b-nvfp4
      api_base: os.environ/SPARK_BASE_URL
      enable_auto_tool_choice: true
      tool_call_parser: true
      supports_function_calling: true

  # DEPRECATED 2026-08-17: qwen35 container was bricked (Triton CUDA kernel-load
  # crash on any real request; /health lied green). Service stopped; entry kept
  # for reference until callers migrate. Will 404 while service is stopped.
  - model_name: spark/qwen35-35b-a3b-fp8
    litellm_params:
      model: openai/qwen35-35b-a3b-fp8
      api_base: os.environ/SPARK_BASE_URL
      enable_auto_tool_choice: true
      tool_call_parser: true
      supports_function_calling: true

  - model_name: spark/qwen3-30b-a3b-fp8
    litellm_params:
      model: openai/qwen3-30b-a3b-fp8
      api_base: os.environ/SPARK_BASE_URL
      enable_auto_tool_choice: true
      tool_call_parser: true
      supports_function_calling: true

  - model_name: spark/llama31-8b-fp8
    litellm_params:
      model: openai/llama31-8b-fp8
      api_base: os.environ/SPARK_BASE_URL
