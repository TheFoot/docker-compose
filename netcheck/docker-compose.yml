name: netcheck

services:
  netcheck:
    build: .
    container_name: netcheck
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    volumes:
      - ./netcheck.py:/app/netcheck.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/data/dnsmasq:/host/dnsmasq:ro
      - /proc/sys/net/ipv4:/host/proc/sys/net/ipv4:ro
      - /home/thefoot/dave:/home/thefoot/dave:ro
    environment:
      - NETCHECK_PORT=8090
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=network_monitor
      - DAVE_REPO_ROOT=/home/thefoot/dave
